<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veyra — Widget standalone</title>
<style>
body{margin:0;background:#07080c;color:#e9ebf1;font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;padding:32px}
.card{max-width:420px;margin:0 auto;background:#0d0f15;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px}
h1{font-size:18px;margin:0 0 4px}p{color:#9aa1b2;font-size:13px}
pre{background:#0a0c11;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px;font-size:12px;color:#c9d1e3;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
<h1>VEYRA · Widget standalone</h1>
<p>Démo d'intégration tierce via <code>/widget.js</code> servi par l'API.</p>
<div id="security-check" style="margin:12px 0"></div>
<pre id="out">En attente…</pre>
</div>
<script src="http://localhost:3000/widget.js"></script>
<script>
const API = "http://localhost:3000";
const USER = "demo-tigre";
fetch(API + "/v1/enroll", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ userId: USER, secretWord: "TIGRE", color: "violet", motif: "etoile" })
}).catch(() => {}).finally(() => {
  Veyra.challenge({
    container: "#security-check",
    apiBase: API,
    userId: USER,
    onSuccess: (r) => { document.getElementById("out").textContent = "OK\n" + JSON.stringify(r, null, 2); },
    onFailure: (r) => { document.getElementById("out").textContent = "KO\n" + JSON.stringify(r, null, 2); }
  });
});
</script>
</body>
</html>
